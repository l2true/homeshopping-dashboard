const MONTH_KEYS = ["2026-07", "2026-06", "2026-05", "2026-04", "2026-03", "2026-02"];

function fmt(v) { return v.toLocaleString('en-US'); }
function dayLabel(yyyymmdd) { return yyyymmdd.slice(4,6) + '-' + yyyymmdd.slice(6,8); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function truncName(s) {
  s = String(s);
  if (s.length <= 10) return esc(s);
  return '<span title="' + esc(s) + '">' + esc(s.slice(0, 10)) + '…</span>';
}
function deltaHtml(pct) {
  if (pct === null || pct === undefined) return '<span class="delta muted">N/A</span>';
  var cls = pct >= 0 ? 'up' : 'down';
  var arrow = pct >= 0 ? '▲' : '▼';
  var sign = pct >= 0 ? '+' : '';
  return '<span class="delta ' + cls + '">' + arrow + ' ' + sign + pct.toFixed(1) + '%</span>';
}
function buildPrevDay(d) {
  var labels = [['딜명','deal_nm'],['딜코드','deal_no'],['구좌실적','deal_amt'],
    ['상품실적(취급액)','sal_amt'],['상품실적(고객수)','cust_cnt'],['클릭UV','click_uv']];
  var head = '<tr><th></th>' + d.bhrs.map(function(b){return '<th>'+b+'</th>';}).join('') + '</tr>';
  var body = labels.map(function(pair){
    var label = pair[0], key = pair[1];
    var cells = d.bhrs.map(function(b){
      var rec = d.prev_day[b];
      if (!rec) return '<td>-</td>';
      var v = rec[key];
      if (key === 'deal_nm') return '<td>'+truncName(v)+'</td>';
      if (typeof v === 'number') v = fmt(v);
      return '<td>'+v+'</td>';
    }).join('');
    return '<tr><th>'+label+'</th>'+cells+'</tr>';
  }).join('');
  return '<div class="panel"><div class="panel-title">📌 전일 실적 <span class="panel-sub">' +
    (d.latest_day ? dayLabel(d.latest_day) : '') + '</span></div><table class="ptable"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}
function buildTop5(d) {
  var rows = d.top5.map(function(item){
    return '<tr><td>'+truncName(item.deal_nm)+'</td><td class="num">'+fmt(item.deal_amt)+'</td><td class="num">'+fmt(item.click_uv)+'</td><td class="num">'+fmt(item.sal_amt)+'</td></tr>';
  }).join('');
  return '<div class="panel"><div class="panel-title">🔥 TOP5 <span class="panel-sub">해당월 · 구좌실적순</span></div>' +
    '<table class="ptable"><thead><tr><th>딜명</th><th>구좌실적</th><th>클릭UV</th><th>상품실적(취급액)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function buildKpi(title, sub, section, d) {
  var metricLabels = [['구좌실적','deal_amt'],['전월비','mom_pct'],['전년비','yoy_pct'],
    ['상품실적(취급액)','sal_amt'],['상품실적(고객수)','cust_cnt'],['클릭UV','click_uv']];
  var head = '<tr><th></th>' + d.bhrs.map(function(b){return '<th>'+b+'</th>';}).join('') + '</tr>';
  var body = metricLabels.map(function(pair){
    var label = pair[0], key = pair[1];
    var cells = d.bhrs.map(function(b){
      var v = d.avg_cum[b][section][key];
      if (key === 'mom_pct' || key === 'yoy_pct') return '<td>'+deltaHtml(v)+'</td>';
      return '<td class="num">'+fmt(v)+'</td>';
    }).join('');
    return '<tr><th>'+label+'</th>'+cells+'</tr>';
  }).join('');
  return '<div class="panel"><div class="panel-title">'+title+' <span class="panel-sub">'+sub+'</span></div>' +
    '<table class="ptable"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}
function buildDailyBlock(bhr, d) {
  var headDays = d.days.map(function(dd){return '<th>'+dayLabel(dd)+'</th>';}).join('');
  var metricRows = [['딜명','deal_nm',false],['딜코드','deal_no',false],
    ['구좌실적','deal_amt',true],['상품실적(취급액)','sal_amt',true],
    ['상품실적(고객수)','cust_cnt',true],['클릭UV','click_uv',true]];
  var body = metricRows.map(function(triple){
    var label = triple[0], key = triple[1], isNum = triple[2];
    var cells = d.days.map(function(dd){
      var rec = (d.daily[bhr] || {})[dd];
      if (!rec) return '<td class="empty">-</td>';
      var v = rec[key];
      if (key === 'deal_nm') return '<td>'+truncName(v)+'</td>';
      if (isNum) v = fmt(v);
      return '<td class="'+(isNum?'num':'')+'">'+v+'</td>';
    }).join('');
    return '<tr><th class="rowhead">'+label+'</th>'+cells+'</tr>';
  }).join('');
  return '<div class="daily-block"><div class="daily-bhr-label">'+bhr+'</div><div class="daily-scroll">' +
    '<table class="dtable"><thead><tr><th class="rowhead">구분</th>'+headDays+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function render(monthKey) {
  var d = DATA[monthKey];
  document.getElementById('grid4').innerHTML =
    buildPrevDay(d) + buildTop5(d) +
    buildKpi('📊 일평균 실적', d.month_label + ' 1일 평균', 'avg', d) +
    buildKpi('🚩 월누적 실적', d.month_label + ' 누적', 'cum', d);
  document.getElementById('daily-section').innerHTML = d.bhrs.map(function(b){return buildDailyBlock(b, d);}).join('');
}
document.getElementById('monthSelect').addEventListener('change', function(e){ render(e.target.value); });
render(MONTH_KEYS[0]);

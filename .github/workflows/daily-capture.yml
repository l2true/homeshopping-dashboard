name: daily-capture

# 매일 쇼핑몰 4곳을 캡처해 저장소(captures/날짜/)에 올린다. 요약(AI 분석)은 사내망 PC가 나중에 채운다.
# 같은 날짜가 이미 저장소에 있으면 건너뛰므로 보조 스케줄이 있어도 중복되지 않는다.
# (정각은 GitHub 서버가 몰려 지연되기 쉬워 17분/47분으로 잡음. 모두 UTC 기준)
on:
  schedule:
    - cron: '17 23 * * *'    # 매일 08:17 KST
    - cron: '47 0 * * *'     # 매일 09:47 KST (위 스케줄이 지연/누락됐을 때를 위한 보조)
  workflow_dispatch:

concurrency:
  group: daily-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            capture_homeshopping.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pillow
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum fonts-noto-cjk
          playwright install --with-deps chromium

      - name: Capture and publish
        run: python capture_homeshopping.py --cloud

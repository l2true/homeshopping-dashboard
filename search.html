    {key:'lotte',   label:'롯데홈쇼핑', color:'#d05a5a', soft:'#fbeaea'},
    {key:'hyundai', label:'현대홈쇼핑', color:'#e08a4a', soft:'#fcefe2'},
  ];
  const DOW = ['일','월','화','수','목','금','토'];
  const TYPES = ['카드','적립','쿠폰','할인','특가','경품','사은품'];
  const TYPE_COLORS = {'카드':'#1d4ed8','적립':'#059669','쿠폰':'#db2777','할인':'#c2410c','특가':'#854d0e','경품':'#6d28d9','사은품':'#15803d'};
  const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  function mondayOf(s){ const d=(typeof s==='string')?parse(s):new Date(s); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d; }

  // 기간(period) 텍스트에서 시작일 추출 (범위형일 때만 의미)
  function periodStart(period, refISO){
    const mds = (period||'').match(/\d{1,2}\/\d{1,2}/g);
    if(!mds) return null;
    const [mo,da] = mds[0].split('/').map(Number);
    const rd = parse(refISO);
    let st = new Date(rd.getFullYear(), mo-1, da);
    if(st > rd && rd.getMonth() <= 2 && (mo-1) >= 9) st = new Date(rd.getFullYear()-1, mo-1, da); // 연초 캡처 + 작년말 시작
    return st;
  }
  // 기간(period) 텍스트에서 종료일 추출
  function periodEnd(period, startISO){
    if(!period) return null;
    const mds = period.match(/\d{1,2}\/\d{1,2}/g);
    if(!mds) return null;
    const [mo,da] = mds[mds.length-1].split('/').map(Number);
    const sd = parse(startISO);
    let end = new Date(sd.getFullYear(), mo-1, da);
    if(end < sd){
      // 연말→연초 교차(예: 12월 시작 → 1월 종료)만 다음해로. 그 외 과거 날짜는 stale이므로 무시.
      if(sd.getMonth() >= 9 && (mo-1) <= 2) end = new Date(sd.getFullYear()+1, mo-1, da);
      else return null;
    }
    return end;
  }

  // 행사명 정규화 (공백·문장부호 제거, 소문자화) 및 매칭
  function nameKey(n){ return (n||'').toLowerCase().replace(/hot/g,'핫').replace(/\s+/g,'').replace(/[!~·,\/\-_.()]/g,''); }
  function nameMatch(a, b){
    const x = nameKey(a), y = nameKey(b);
    if(!x || !y) return false;
    if(x === y) return true;                       // 표기만 다른 동일명
    const [s, l] = x.length <= y.length ? [x, y] : [y, x];
    if(s.length >= 4 && l.includes(s)) return true;  // 한쪽이 다른 쪽을 포함(4자 이상)
    // 접두+접미는 같고 가운데 한두 글자만 삽입된 경우 동일 취급
    // (예: "상반기어워즈" ⟷ "상반기앱어워즈")
    if(s.length >= 4 && l.length - s.length <= 2){
      let p = 0; while(p < s.length && s[p] === l[p]) p++;
      let q = 0; while(q < s.length - p && s[s.length-1-q] === l[l.length-1-q]) q++;
      if(p + q >= s.length) return true;
    }
    return false;
  }

  // 매일 브랜드만 바뀌는 정기 행사는 대표명으로 통일 (브랜드명은 행사명에서 제거)
  // 예: "씨드비 지금이닷 브랜드", "지금이닷 브랜드 (돌체구스토)" → "지금이닷 브랜드"
  function canonName(n){
    n = n || '';
    if(/지금이닷/.test(n)) return '지금이닷 브랜드';
    if(/썸머스타트/.test(n)) return '썸머스타트';          // 패션NOW 썸머스타트 등 → 서브타이틀이 행사명
    if(/뷰티위크/.test(n)) return '뷰티위크';              // 현대Hmall 뷰티위크/뷰티위크 특가모음 등
    if(/pick/i.test(n) && /(5월|오월)/.test(n)) return '5월 PICK DAY';  // 5월/오월 PICK 데이
    return n;
  }

  // summaries → 채널별 이벤트 목록 (간트 막대 단위)
  const events = {gs:[], cj:[], lotte:[], hyundai:[]};
  (function buildEvents(){
    const dates = Object.keys(summaries).sort();
    const byCh = {gs:{}, cj:{}, lotte:{}, hyundai:{}};
    dates.forEach(date => {
      const day = summaries[date] || {};
      channels.forEach(ch => {
        const s = day[ch.key];
        if(!s || !s.name || s.name === '해당없음') return;
        // 캡처 날짜 기준으로 그룹핑 (stale한 start 필드 무시) → 반복 1일 행사가 길게 늘어나지 않음.
        // 여러 날 지속 행사는 아래 merge에서 period 종료일이 다리를 놓아 한 막대로 통합됨.
        const key = date + '|' + s.name;
        let ev = byCh[ch.key][key];
        if(!ev){ ev = {name:canonName(s.name), startISO:date, period:s.period||'', minD:date, maxD:date, types:new Set()}; byCh[ch.key][key]=ev; }
        if(date < ev.minD) ev.minD = date;
        if(date > ev.maxD) ev.maxD = date;
        if(s.period) ev.period = s.period;
        (s.body||'').split('\n').forEach(l => { l=l.trim(); const i=l.indexOf(':'); if(i>0){ const t=l.slice(0,i).trim(); if(TYPES.includes(t)) ev.types.add(t); } });
      });
    });
    channels.forEach(ch => {
      const occ = Object.values(byCh[ch.key]).map(ev => {
        let st = parse(ev.minD);
        let end = parse(ev.maxD);
        const mds = (ev.period||'').match(/\d{1,2}\/\d{1,2}/g) || [];
        const sameDay = mds.length >= 2 && mds[0] === mds[mds.length-1];   // "6/11~6/11" 같은 stale 1일
        const fullRange = mds.length >= 2 && !sameDay;                      // 진짜 기간 범위
        if(!sameDay && mds.length >= 1){
          const pe = periodEnd(ev.period, ev.minD);
          if(pe && pe > end) end = pe;   // 기간 종료일 반영
        }
        if(fullRange){
          const ps = periodStart(ev.period, ev.minD);
          if(ps && ps < st && (st - ps)/DAY <= 60) st = ps;   // 배너 시작일이 캡처보다 이르면 확장(60일 이내)
        }
        if(end < st) end = st;
        ev._start = st; ev._end = end; ev.hasRange = fullRange;
        return ev;
      });
      // 이름이 같은(표기 흔들림 포함) + 기간이 겹치거나 맞닿는 행사를 하나의 막대로 병합.
      // (패션 클리어런스처럼 start가 갈라진 동일 캠페인, "상반기 어워즈"="상반기어워즈"(공백),
      //  "건강한데이"⊂"건강식품 건강한데이"(포함) 등 통합. 멀리 떨어진 반복 행사는 분리 유지)
      occ.sort((a,b) => a._start - b._start);
      const merged = [];
      occ.forEach(ev => {
        let target = null;
        for(const c of merged){
          // 기간 범위가 있는 행사끼리는 실제 겹칠 때만(맞닿음 X) 병합 → 인접 주차 행사(지금이닷 등) 잘못 붙는 것 방지.
          // 둘 다 1일/범위없음이면 하루 인접(+1)까지 병합(뷰티위크 연속 캡처 등).
          const gap = (ev.hasRange || c.hasRange) ? 0 : DAY;
          const overlap = ev._start.getTime() <= c._end.getTime() + gap &&
                          ev._end.getTime()   >= c._start.getTime() - gap;
          if(overlap && nameMatch(c.name, ev.name)){ target = c; break; }
        }
        if(target){
          if(ev._end > target._end) target._end = ev._end;
          if(ev._start < target._start) target._start = ev._start;
          if(ev.hasRange) target.hasRange = true;
          if(ev.minD < target.firstDate) target.firstDate = ev.minD;  // 가장 이른 등장일
          ev.types.forEach(t => target.types.add(t));
          if(ev.period && !target.period) target.period = ev.period;
          // 더 짧고 깔끔한 이름을 대표명으로
          if(nameKey(ev.name).length < nameKey(target.name).length) target.name = ev.name;
        } else {
          merged.push({name:ev.name, period:ev.period, types:new Set(ev.types), _start:ev._start, _end:ev._end, ch:ch.key, firstDate:ev.minD});
        }
      });
      events[ch.key] = merged;
    });
  })();


  // 검색어 정규화 매칭: 공백 무시 + 소문자 + 부분 포함
  function normQ(s){ return (s||'').replace(/\s+/g,'').toLowerCase(); }
  function matchQuery(query, eventName){
    const nq = normQ(query);
    if(!nq) return true;
    return normQ(eventName).includes(nq);
  }

  // 채널별 events → 하나의 리스트로 평탄화
  const allEvents = [];
  channels.forEach(ch => {
    (events[ch.key] || []).forEach(ev => allEvents.push(ev));
  });
  allEvents.sort((a,b) => b._start - a._start);

  // 상태 (URL 쿼리파라미터와 동기화)
  const state = { q: '', ch: new Set(), bf: new Set(), from: '', to: '', preset: 'all' };

  function loadFromURL(){
    const qs = new URLSearchParams(location.search);
    state.q = qs.get('q') || '';
    (qs.get('ch')||'').split(',').filter(Boolean).forEach(c => state.ch.add(c));
    (qs.get('bf')||'').split(',').filter(Boolean).forEach(b => state.bf.add(b));
    state.from = qs.get('from') || '';
    state.to = qs.get('to') || '';
    if(state.from || state.to) state.preset = 'custom';
  }
  function syncURL(){
    const qs = new URLSearchParams();
    if(state.q) qs.set('q', state.q);
    if(state.ch.size) qs.set('ch', [...state.ch].join(','));
    if(state.bf.size) qs.set('bf', [...state.bf].join(','));
    if(state.from) qs.set('from', state.from);
    if(state.to) qs.set('to', state.to);
    const url = location.pathname + (qs.toString() ? '?' + qs.toString() : '');
    history.replaceState(null, '', url);
  }

  function buildCompanyFilters(){
    const box = document.getElementById('company-filters');
    box.innerHTML = channels.map(ch =>
      `<span class="chip${state.ch.has(ch.key)?' active':''}" data-ch="${ch.key}" onclick="toggleCh('${ch.key}')">${ch.label}</span>`
    ).join('');
  }
  function buildBenefitFilters(){
    const box = document.getElementById('benefit-filters');
    box.innerHTML = TYPES.map(t =>
      `<span class="chip${state.bf.has(t)?' active':''}" data-bf="${t}" onclick="toggleBf('${t}')" style="${state.bf.has(t)?`background:${TYPE_COLORS[t]}`:''}">${t}</span>`
    ).join('');
  }
  function toggleCh(c){ state.ch.has(c) ? state.ch.delete(c) : state.ch.add(c); buildCompanyFilters(); runSearch(); }
  function toggleBf(t){ state.bf.has(t) ? state.bf.delete(t) : state.bf.add(t); buildBenefitFilters(); runSearch(); }

  function setPreset(p){
    state.preset = p;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset===p));
    if(p === 'all'){ state.from=''; state.to=''; }
    else if(p === '1m' || p === '3m'){
      const days = p === '1m' ? 30 : 90;
      const t = parse(TODAY);
      const f = new Date(t); f.setDate(f.getDate() - days);
      state.from = toStr(f); state.to = TODAY;
    }
    document.getElementById('from-date').value = state.from;
    document.getElementById('to-date').value = state.to;
    runSearch();
  }

  function passFilters(ev){
    if(!matchQuery(state.q, ev.name)) return false;
    if(state.ch.size && !state.ch.has(ev.ch)) return false;
    if(state.bf.size){
      let ok = false;
      for(const t of state.bf) if(ev.types.has(t)) { ok = true; break; }
      if(!ok) return false;
    }
    if(state.from){ const f = parse(state.from); if(ev._end < f) return false; }
    if(state.to){ const t = parse(state.to); if(ev._start > t) return false; }
    return true;
  }

  function fmtPeriod(ev){
    const f = d => `${d.getMonth()+1}/${d.getDate()}`;
    if(ev._start.getTime() === ev._end.getTime()) return f(ev._start);
    return `${f(ev._start)} ~ ${f(ev._end)}`;
  }

  function renderResults(){
    const list = allEvents.filter(passFilters);
    const meta = document.getElementById('result-meta');
    meta.textContent = `총 ${list.length}건`;
    const box = document.getElementById('results');
    if(!list.length){
      box.innerHTML = '<div class="empty">조건에 맞는 행사가 없습니다</div>';
      return;
    }
    box.innerHTML = list.map(ev => {
      const ch = channels.find(c => c.key === ev.ch);
      const tags = [...ev.types].map(t => `<span class="rtag" style="background:${TYPE_COLORS[t]}22;color:${TYPE_COLORS[t]}">${t}</span>`).join('');
      const shot = `captures/${ev.firstDate}/${ev.ch}_next_tab_full.png`;
      return `<div class="rcard" onclick="goToSchedule('${ev.ch}','${ev.firstDate}')">
        <img class="rshot" src="${shot}" alt="" onerror="this.style.visibility='hidden'">
        <div class="rbody">
          <div class="rtop">
            <span class="rlogo" style="background:${ch.color}">${ch.label}</span>
            <span class="rname">${ev.name}</span>
            <span class="rperiod">${fmtPeriod(ev)}</span>
          </div>
          <div class="rtags">${tags}</div>
        </div>
      </div>`;
    }).join('');
  }

  function goToSchedule(ch, date){
    location.href = `schedule.html?ch=${ch}&date=${date}`;
  }

  function runSearch(){
    state.q = document.getElementById('q').value;
    syncURL();
    renderResults();
  }

  document.getElementById('q').addEventListener('input', runSearch);
  document.getElementById('from-date').addEventListener('change', e => { state.from = e.target.value; state.preset='custom'; document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active')); runSearch(); });
  document.getElementById('to-date').addEventListener('change', e => { state.to = e.target.value; state.preset='custom'; document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active')); runSearch(); });
  document.querySelectorAll('.preset-btn').forEach(b => b.addEventListener('click', () => setPreset(b.dataset.preset)));
  document.getElementById('reset-btn').addEventListener('click', () => {
    state.q=''; state.ch.clear(); state.bf.clear(); state.from=''; state.to=''; state.preset='all';
    document.getElementById('q').value = '';
    document.getElementById('from-date').value = '';
    document.getElementById('to-date').value = '';
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset==='all'));
    buildCompanyFilters(); buildBenefitFilters(); runSearch();
  });

  loadFromURL();
  document.getElementById('q').value = state.q;
  document.getElementById('from-date').value = state.from;
  document.getElementById('to-date').value = state.to;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset===state.preset));
  buildCompanyFilters();
  buildBenefitFilters();
  renderResults();
</script>
</body>
</html>
